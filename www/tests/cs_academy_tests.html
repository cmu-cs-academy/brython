<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- Test page used by scripts/run_browser_tests.py (CS Academy fork) -->
<script src="../src/brython.js"></script>
<script src="../src/brython_stdlib.js"></script>
<!-- Javascript code needed to run tests included in dom.py -->
<script src="dom_js_tests.js"></script>
<!-- Javascript code needed to run JSObject tests -->
<script src="jsobj_tests.js"></script>

<body onload="brython({debug: 1, indexedDB: false})">
<!-- HTML needed to run tests included in dom.py -->
<div id="dom-test-element-id"></div>
<div id="banner_row"></div>
<div id="container"></div>

<script>
// Web worker test: python_to_js must work in a worker, without leaking
// builtins into the global scope
window.run_web_worker_test = function(){
    return new Promise(function(resolve){
        var w = new Worker('web_worker_tests.js')
        var timer = setTimeout(() => resolve('timeout'), 20000)
        w.onmessage = function(e){
            clearTimeout(timer)
            resolve(e.data === 'world' ? 'ok' : 'unexpected message ' + e.data)
        }
        w.onerror = function(e){
            clearTimeout(timer)
            resolve('error in web worker: ' + e.message)
        }
    })
}
</script>

<script type="text/python">
from browser import window
import brython_test_utils as utils

def list_tests():
    res = []
    for group, mods in utils.discover_brython_test_modules():
        for fn, cap in mods:
            res.append(fn)
    return res

def run_one(fn):
    state, t0, t1, msg = utils.run_test_module(fn)
    return [state, round((t1 - t0) * 1000), msg]

def run_statements(fn):
    # Run each top-level statement of a module separately, so that a failure
    # doesn't hide the statements after it. Returns the failures as
    # [line, first line of the statement, last line of the error, traceback]
    import ast
    import time
    import traceback
    src = open(fn).read()
    lines = src.splitlines()
    ns = {'__name__': '__main__', '__file__': fn}
    failures = []
    t0 = time.perf_counter()
    try:
        body = ast.parse(src, fn).body
    except SyntaxError:
        tb = traceback.format_exc()
        return [0, [[0, '<module>', tb.strip().splitlines()[-1], tb]]]
    for node in body:
        start = min([node.lineno] +
                    [d.lineno for d in getattr(node, 'decorator_list', [])])
        # pad with newlines to keep the line numbers of the module
        code = '\n' * (start - 1) + '\n'.join(lines[start - 1:node.end_lineno])
        try:
            exec(compile(code, fn, 'exec'), ns)
        except Exception:
            tb = traceback.format_exc()
            failures.append([start, lines[start - 1].strip(),
                             tb.strip().splitlines()[-1], tb])
    t1 = time.perf_counter()
    return [round((t1 - t0) * 1000), failures]

window.list_tests = list_tests
window.run_one = run_one
window.run_statements = run_statements
window.harness_ready = True
</script>
</body>
</html>
