name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # make_dist.py requires the same Python version as Brython's
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Build dist
        run: |
          mkdir -p setup/brython/data
          (cd scripts && python3 make_dist.py)

      - name: Run browser tests
        run: python3 scripts/run_browser_tests.py

